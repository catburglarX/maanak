<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Officer sign-in — Maanak</title>
  <meta name="description" content="Sign in to the Maanak inspection workspace.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-public-chrome>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="container narrow">
      <h1>Officer sign-in</h1>
      <p class="muted">There is no public registration. Accounts are created by an administrator.</p>

      <form id="signin-form" novalidate>
        <div id="signin-status" class="status-region" aria-live="polite"></div>
        <div class="field">
          <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" required aria-required="true" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password <span class="req" aria-hidden="true">*</span></label>
          <input type="password" id="password" name="password" required aria-required="true" autocomplete="current-password">
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-accent" id="signin-btn">Sign in</button>
        </div>
      </form>

      <section id="bootstrap-section" hidden>
        <hr class="section-rule">
        <h2>One-time administrator setup</h2>
        <div class="notice notice-info">
          <p>This workspace has not been initialised. Create the first administrator account. This can only be done once.</p>
        </div>
        <form id="bootstrap-form" novalidate>
          <div id="bootstrap-status" class="status-region" aria-live="polite"></div>
          <div class="field">
            <label for="b-name">Administrator name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="b-name" name="name" required aria-required="true" autocomplete="name">
          </div>
          <div class="field">
            <label for="b-email">Email <span class="req" aria-hidden="true">*</span></label>
            <input type="email" id="b-email" name="email" required aria-required="true" autocomplete="email">
          </div>
          <div class="field">
            <label for="b-password">Password <span class="req" aria-hidden="true">*</span></label>
            <p class="hint" id="pw-policy">Loading password requirements…</p>
            <input type="password" id="b-password" name="password" required aria-required="true" autocomplete="new-password" aria-describedby="pw-policy">
          </div>
          <div class="row">
            <div class="field grow-200">
              <label for="b-jcode">Jurisdiction code <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="b-jcode" name="jurisdiction_code" required aria-required="true">
            </div>
            <div class="field grow-240">
              <label for="b-jname">Jurisdiction name <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="b-jname" name="jurisdiction_name" required aria-required="true">
            </div>
          </div>
          <div class="field">
            <label for="b-designation">Designation</label>
            <input type="text" id="b-designation" name="designation">
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary" id="bootstrap-btn">Create administrator</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/public.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
