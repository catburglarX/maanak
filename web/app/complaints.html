<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaints — Maanak workspace</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <div id="app-header"></div>
    <main id="main" class="app-main">
      <div class="container">
        <h1>Complaint triage</h1>
        <p class="workspace-sub">Ordered by priority. The published priority reason is shown for each complaint.</p>
        <form id="filters" class="filters" role="search">
          <div class="field grow">
            <label for="f-search">Search</label>
            <input type="search" id="f-search" name="search" placeholder="Reference, product…">
          </div>
          <div class="field">
            <label for="f-state">State</label>
            <select id="f-state" name="state"></select>
          </div>
          <div class="field checkbox-row self-center">
            <input type="checkbox" id="f-unassigned" name="unassigned">
            <label for="f-unassigned">Unassigned</label>
          </div>
          <div class="field checkbox-row self-center">
            <input type="checkbox" id="f-mine" name="mine">
            <label for="f-mine">Assigned to me</label>
          </div>
          <div class="field"><button class="btn" type="submit">Apply</button></div>
        </form>
        <div id="register" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/pages/complaints.js"></script>
</body>
</html>
