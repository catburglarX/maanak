<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your account · Maanak workspace</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <div id="app-header"></div>
    <main id="main" class="app-main">
      <div class="container narrow">
        <h1>Your account</h1>
        <div id="page-status" class="status-region" aria-live="polite"></div>
        <div id="profile"></div>

        <section aria-labelledby="pw-h">
          <h2 id="pw-h">Change password</h2>
          <form id="pw-form" novalidate>
            <div id="pw-status" class="status-region" aria-live="polite"></div>
            <div class="field">
              <label for="current">Current password <span class="req" aria-hidden="true">*</span></label>
              <input type="password" id="current" name="current_password" required aria-required="true" autocomplete="current-password">
            </div>
            <div class="field">
              <label for="newpw">New password <span class="req" aria-hidden="true">*</span></label>
              <p class="hint" id="pw-policy">Loading requirements…</p>
              <input type="password" id="newpw" name="new_password" required aria-required="true" autocomplete="new-password" aria-describedby="pw-policy">
            </div>
            <div class="btn-row"><button class="btn btn-primary" type="submit">Change password</button></div>
          </form>
        </section>

        <section aria-labelledby="sess-h">
          <h2 id="sess-h">Your sessions</h2>
          <div id="sessions" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/pages/account.js"></script>
</body>
</html>
