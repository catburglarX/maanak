[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The URL is set at runtime from DATABASE_URL in migrations/env.py.
sqlalchemy.url = postgresql+psycopg://maanak:maanak@localhost:5432/maanak

# Keep revision filenames sortable and readable.
file_template = %%(rev)s_%%(slug)s

# Formatting is applied by `ruff format` in CI rather than a post-write hook, so
# that generating a migration does not require dev dependencies in the image.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
