[project]
name = "maanak-api"
version = "3.0.0"
description = "Maanak: evidence-led Legal Metrology packaged-commodity inspection platform"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

# Versions are upper-bounded on the next major so that a clean build months from
# now resolves to the same generation of each library. requirements.lock.txt in
# this directory pins the exact resolved set used by the container image.
dependencies = [
  # Web
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
  # Data
  "sqlalchemy[asyncio]==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "email-validator==2.2.0",
  # Security
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  # Queue
  "arq==0.26.3",
  "redis==5.2.1",
  # Object storage
  "boto3==1.35.86",
  # Imaging and OCR
  "pillow==11.0.0",
  "numpy==2.2.1",
  "opencv-python-headless==4.10.0.84",
  "pytesseract==0.3.13",
  "zxing-cpp==2.2.0",
  # Documents
  "reportlab==4.2.5",
  "python-docx==1.1.2",
  "qrcode==8.0",
  # Outbound fetch
  "httpx==0.28.1",
  "beautifulsoup4==4.12.3",
  # Observability
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "types-requests==2.32.0.20241016",
  "pip-audit==2.7.3",
  "playwright==1.49.1",
  "pytest-playwright==0.6.2",
  "axe-playwright-python==0.1.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "integration: requires a live PostgreSQL database",
  "browser: requires Playwright and a running stack",
  "slow: long-running benchmark or performance test",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "RUF",       # ruff rules
  "S",         # bandit security
  "ASYNC",     # async correctness
  "T20",       # no print in library code
  "BLE",       # no bare/broad except
  "TRY",       # exception handling hygiene
]
ignore = [
  "TRY003",  # long messages in raise are intentional: users read them
  "TRY400",  # logger.error is deliberate in a few handlers
  "B008",    # FastAPI Depends() in defaults is the documented pattern
  "SIM108",  # ternaries are not always clearer
  # Indian-language content is central to this project. Rupee signs, Devanagari and
  # the characters that look similar to Latin ones appear in real declaration text,
  # unit tables and month names, and must not be "corrected".
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed sample credentials, and print progress on purpose.
"tests/*" = ["S101", "S105", "S106", "S311", "T201", "E501"]
# The verification suites are executable documentation: they print every check, use
# fixed sample passwords against a local stack, assert directly, and their long
# descriptive strings are the point.
"scripts/*" = [
  "T201",   # printing each check is the output format
  "S101",   # direct assertions
  "S105",   # fixed sample passwords for a local stack
  "S106",
  "S310",   # urllib against a known local URL
  "S603",   # fixed argument lists, no shell
  "S607",
  "E501",   # long check descriptions read better on one line
  "BLE001", # a diagnostic script reports the exception rather than handling it
  "C901",   # linear end-to-end scripts are clearer in one function
]
# SQLAlchemy declares __mapper_args__ and type_annotation_map as instance variables on
# DeclarativeBase, so annotating them ClassVar satisfies ruff but breaks mypy.
# SQLAlchemy is the authority on its own attributes.
"app/models/*" = ["RUF012"]
"app/worker/main.py" = ["RUF012"]
# Released migrations are generated and must not be reformatted into a different shape.
"migrations/*" = ["E501", "N999", "RUF012"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(migrations|tests)/"
# Several pinned dependencies (reportlab, boto3/botocore, pytesseract, python-docx,
# opencv, qrcode, zxing-cpp) ship no type information. Their call sites are covered by
# the verification suites instead. The error code is disabled rather than silenced with
# casts, which would hide real type problems in our own code.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["app.models.*", "app.domain.*", "app.services.*", "app.security.*"]
disallow_untyped_defs = true

# These packages ship no type information. Their imports are ignored rather than
# followed: following an untyped module makes mypy report every name it cannot see as a
# missing attribute, which is noise rather than signal. Their call sites are covered by
# the verification suites.
[[tool.mypy.overrides]]
module = [
  "botocore.*",
  "boto3.*",
  "cv2.*",
  "docx.*",
  "pytesseract.*",
  "qrcode.*",
  "reportlab.*",
  "zxingcpp.*",
  "arq.*",
]
ignore_missing_imports = true
